<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Wack Club Orchard</title>
  <meta name="description" content="Wack Club Orchard: a self-hosted, Kubernetes-native platform for deploying apps, databases and jobs.">
  <meta name="theme-color" content="#f4f4f4" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0a0a0a" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="/app.css?v=__V__">
  <script>
    (function () {
      try {
        var t = localStorage.getItem("wackcluborchard-theme") || "system";
        var dark = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.dataset.theme = dark ? "dark" : "light";
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <div id="app"><div class="boot"><span class="spinner"></span></div></div>
  <noscript>Wack Club Orchard needs JavaScript.</noscript>
  <script type="module" src="/assets/main.js?v=__V__"></script>
</body>
</html>
