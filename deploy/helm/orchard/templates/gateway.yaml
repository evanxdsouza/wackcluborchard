{{- if .Values.gateway.enabled }}
# One shared Gateway terminates TLS for every generated app hostname with a
# wildcard certificate; apps attach HTTPRoutes to it.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Release.Namespace }}
  labels: {{- include "orchard.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 8443
      hostname: "*.{{ .Values.gateway.http.appDomain }}"
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.gateway.http.wildcardSecret }}
      allowedRoutes:
        namespaces:
          from: All
    - name: http
      protocol: HTTP
      port: 8000
      hostname: "*.{{ .Values.gateway.http.appDomain }}"
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: orchard-apps-wildcard
  namespace: {{ .Release.Namespace }}
spec:
  secretName: {{ .Values.gateway.http.wildcardSecret }}
  dnsNames:
    - "*.{{ .Values.gateway.http.appDomain }}"
  issuerRef:
    kind: ClusterIssuer
    name: {{ .Values.gateway.http.wildcardIssuer }}
{{- end }}
