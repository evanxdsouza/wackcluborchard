apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wackcluborchard-data
  namespace: {{ .Release.Namespace }}
  labels: {{- include "wackcluborchard.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wackcluborchard-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "wackcluborchard.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    type: Recreate   # single-writer state volume
  selector:
    matchLabels:
      app.kubernetes.io/name: wackcluborchard
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wackcluborchard
        app.kubernetes.io/component: server
      annotations:
        checksum/values: {{ toJson .Values | sha256sum }}
    spec:
      serviceAccountName: wackcluborchard-server
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: server
          image: {{ include "wackcluborchard.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-runtime", "kubernetes"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WACKCLUBORCHARD_DATA
              value: /data
            - name: WACKCLUBORCHARD_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: WACKCLUBORCHARD_DOMAIN
              value: {{ .Values.ingress.host | quote }}
            - name: APP_DOMAIN
              value: {{ .Values.gateway.http.appDomain | quote }}
            - name: GATEWAY_NAME
              value: {{ .Values.gateway.name | quote }}
            - name: GATEWAY_NAMESPACE
              value: {{ .Release.Namespace }}
            - name: TENANT_INGRESS_CLASS
              value: {{ .Values.tenant.ingressClass | quote }}
            - name: TENANT_CERT_ISSUER
              value: {{ .Values.tenant.certClusterIssuer | quote }}
            - name: TENANT_STORAGE_CLASS
              value: {{ .Values.tenant.storageClass | quote }}
            - name: REGISTRY_HOST
              value: {{ include "wackcluborchard.registryHost" . | quote }}
            - name: REGISTRY_INSECURE
              value: {{ .Values.registry.insecure | quote }}
            - name: SIGNUP_MODE
              value: {{ .Values.signupMode | quote }}
            - name: BUILD_SLOTS
              value: {{ .Values.buildSlots | quote }}
            - name: MCP_ENABLED
              value: {{ .Values.mcp.enabled | quote }}
            - name: MCP_DOMAIN
              value: {{ .Values.mcp.host | quote }}
            - name: FORWARD_AUTH_URL
              value: "http://wackcluborchard-server.{{ .Release.Namespace }}.svc.cluster.local:8080/api/auth/forward"
            - name: TENANT_SANDBOX
              value: {{ .Values.tenantSandbox.enabled | quote }}
            - name: BUILDER_SANDBOX
              value: {{ .Values.builderSandbox.enabled | quote }}
            {{- if .Values.builderSandbox.enabled }}
            - name: BUILDER_RUNTIME_CLASS
              value: {{ .Values.builderSandbox.runtimeClassName | quote }}
            {{- end }}
            {{- with .Values.server.env }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 20
            periodSeconds: 15
          resources: {{- toYaml .Values.server.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: wackcluborchard-data
---
apiVersion: v1
kind: Service
metadata:
  name: wackcluborchard-server
  namespace: {{ .Release.Namespace }}
  labels: {{- include "wackcluborchard.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: wackcluborchard
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
