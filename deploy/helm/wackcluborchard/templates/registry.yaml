{{- if .Values.registry.enabled }}
# zot: a small OCI registry for images Wack Club Orchard builds.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: registry-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.registry.storage }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: registry-config
  namespace: {{ .Release.Namespace }}
data:
  config.json: |
    {
      "storage": { "rootDirectory": "/var/lib/registry", "gc": true, "dedupe": true },
      "http": { "address": "0.0.0.0", "port": "5000" },
      "log": { "level": "info" }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
  labels: {{- include "wackcluborchard.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app.kubernetes.io/name: wackcluborchard-registry }
  template:
    metadata:
      labels: { app.kubernetes.io/name: wackcluborchard-registry }
    spec:
      containers:
        - name: zot
          image: ghcr.io/project-zot/zot-linux-amd64:v2.1.1
          args: ["serve", "/etc/zot/config.json"]
          ports: [{ name: registry, containerPort: 5000 }]
          volumeMounts:
            - { name: data, mountPath: /var/lib/registry }
            - { name: config, mountPath: /etc/zot }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: registry-data }
        - name: config
          configMap: { name: registry-config }
---
apiVersion: v1
kind: Service
metadata:
  name: registry
  namespace: {{ .Release.Namespace }}
spec:
  selector: { app.kubernetes.io/name: wackcluborchard-registry }
  ports: [{ name: registry, port: 5000, targetPort: registry }]
{{- end }}
